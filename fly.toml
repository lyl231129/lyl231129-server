# 自动生成 by deploy-cloud.js —— 删掉可换 app 名（换个固定域名）
app = 'lyl-deltaforce-f0fb'
primary_region = 'nrt'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
